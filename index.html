<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小羊存錢計畫</title>

    <link rel="apple-touch-icon" href="https://i.imgur.com/8N6G5X0.png">
    <link rel="icon" type="image/png" href="https://i.imgur.com/8N6G5X0.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="小羊金庫">

    <style>
        :root {
            --ro-ui-bg: rgba(255, 255, 255, 0.85); 
            --ro-blue: #3d6cb9;
            --ro-red: #cc3333;
            --zeny-gold: #ff8c00;
        }

        /* 這裡保留你原本所有的 CSS 樣式 ... */
        body {
            background: linear-gradient(135deg, #ffffff 0%, #e9eff5 100%);
            font-family: 'Tahoma', 'Arial', '微軟正黑體', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }

        .ro-window {
            width: 100%; max-width: 460px;
            background: var(--ro-ui-bg);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(137, 167, 211, 0.5);
            border-radius: 30px;
            box-shadow: 0 35px 70px rgba(0,0,0,0.15);
            padding: 45px; position: relative;
        }

        .settings-panel {
            display: none; background: white;
            position: absolute; top: 80px; left: 20px; right: 20px;
            border-radius: 20px; padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            z-index: 200; border: 2px solid var(--ro-blue);
        }

        .settings-btn {
            position: absolute; top: 25px; right: 25px;
            background: none; border: none; font-size: 24px; cursor: pointer; opacity: 0.5; transition: 0.3s;
        }
        .settings-btn:hover { opacity: 1; transform: rotate(45deg); }

        .status-section { text-align: center; margin-bottom: 30px; }
        #job-title { font-size: 16px; font-weight: bold; color: #666; letter-spacing: 1px; display: block; height: 20px; }
        #job-name { margin: 10px 0; font-size: 38px; color: var(--ro-blue); font-weight: 900; text-shadow: 1px 1px 0px white; }
        
        .bar-container { background: rgba(0,0,0,0.1); height: 22px; border-radius: 11px; overflow: hidden; margin-bottom: 35px;}
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4facfe, #00f2fe); transition: 1.5s cubic-bezier(0.22, 1, 0.36, 1); }

        input {
            width: 100%; padding: 20px; margin-bottom: 15px;
            border: 2px solid rgba(0,0,0,0.06); border-radius: 15px;
            font-size: 26px; font-weight: bold; box-sizing: border-box; outline: none; text-align: center; background: #fff;
        }

        .category-group { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 8px; }
        .cat-btn { 
            flex: 1; padding: 10px 0; font-size: 13px; border: 1px solid #ddd; 
            border-radius: 10px; background: white; cursor: pointer; transition: 0.2s; font-weight: bold; color: #666;
        }
        .cat-btn.active { background: var(--ro-blue); color: white; border-color: var(--ro-blue); box-shadow: 0 4px 10px rgba(61, 108, 185, 0.3); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .btn { padding: 20px; border: none; border-radius: 18px; color: white; font-weight: bold; font-size: 22px; cursor: pointer; transition: 0.3s; }
        .btn-in { background: var(--ro-blue); box-shadow: 0 8px 20px rgba(61, 108, 185, 0.2); }
        .btn-out { background: var(--ro-red); box-shadow: 0 8px 20px rgba(204, 51, 51, 0.2); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 35px; border-top: 2px solid #f0f0f0; padding-top: 25px; }
        .stat-card { background: rgba(255,255,255,0.6); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid rgba(0,0,0,0.02); }

        .history-box { font-size: 14px; background: rgba(255,255,255,0.4); border-radius: 18px; padding: 15px; height: 150px; overflow-y: auto; margin-top: 25px; border: 1px solid rgba(0,0,0,0.03); }
        
        .total-display { text-align: right; margin-top: 30px; font-size: 54px; font-weight: 900; color: var(--zeny-gold); letter-spacing: -2px; }

        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            30% { opacity: 1; transform: translate(-50%, -60%) scale(1.3); }
            100% { transform: translate(-50%, -150%) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="ro-window">
    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>

    <div id="settings" class="settings-panel">
        <h3 style="margin: 0 0 15px 0; color: var(--ro-blue);">系統終端設定</h3>
        <label style="font-size: 13px; font-weight: bold;">修改目標總額 (Zeny):</label>
        <input type="number" id="set-target" style="padding:10px; font-size:16px; margin: 10px 0; border: 1px solid #ddd;">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button onclick="saveSettings()" style="padding:10px; background:var(--ro-blue); color:white; border:none; border-radius:8px; cursor:pointer;">套用設定</button>
            <button onclick="toggleSettings()" style="padding:10px; background:#999; color:white; border:none; border-radius:8px; cursor:pointer;">關閉</button>
            <button onclick="exportData()" style="padding:10px; background:#eee; border:1px solid #ccc; border-radius:8px; cursor:pointer;">導出備份</button>
            <button onclick="clearData()" style="padding:10px; background:#fff; border:1px solid red; color:red; border-radius:8px; cursor:pointer;">清空紀錄</button>
        </div>
    </div>

    <div class="status-section">
        <span id="job-title">[ 冒險準備中 ]</span>
        <h2 id="job-name">初心者</h2>
    </div>

    <div class="bar-container"><div id="bar" class="bar-fill"></div></div>

    <div class="interaction-area">
        <input type="number" id="main-input" placeholder="0" inputmode="numeric">
        
        <div class="category-group" id="cat-group">
            <button class="cat-btn active" onclick="setCat('💊 補給', this)">補給</button>
            <button class="cat-btn" onclick="setCat('⚔️ 裝備', this)">裝備</button>
            <button class="cat-btn" onclick="setCat('📜 傳送', this)">傳送</button>
            <button class="cat-btn" onclick="setCat('📦 雜貨', this)">雜貨</button>
        </div>

        <div class="btn-group">
            <button class="btn btn-in" onclick="handle('in')">存入金庫</button>
            <button class="btn btn-out" onclick="handle('out')">支出開銷</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div style="color:#888; font-size:12px; margin-bottom:5px;">本週存入</div>
            <div id="week-in" style="color:var(--ro-blue); font-weight:bold; font-size:18px;">0</div>
        </div>
        <div class="stat-card">
            <div style="color:#888; font-size:12px; margin-bottom:5px;">本週支出</div>
            <div id="week-out" style="color:var(--ro-red); font-weight:bold; font-size:18px;">0</div>
        </div>
    </div>

    <div id="history" class="history-box"></div>

    <div class="total-display">
        <span id="total-val">0</span> <small style="font-size: 20px; color:#999; font-weight:normal;">Z</small>
    </div>
</div>

<script>
    // 這裡保留你原本所有的 JavaScript 邏輯 ...
    let data = { 
        total: 0, 
        target: 10000, 
        logs: [], 
        currentCat: "💊 補給",
        hTitle: ""
    };

    const levels = [
        { threshold: 0,    title: "[ 身上只有 500 z ]", name: "初心者" },
        { threshold: 0.1,  title: "[ 普隆德拉打工仔 ]", name: "劍士" },
        { threshold: 0.35, title: "[ 艾爾貝塔零售商 ]", name: "商人" },
        { threshold: 0.65, title: "[ 影子公會金庫經理 ]", name: "刺客" },
        { threshold: 1.0,  title: "[ 國王繼承人 ]", name: "傳奇英雄" }
    ];

    function toggleSettings() {
        const s = document.getElementById('settings');
        s.style.display = s.style.display === 'block' ? 'none' : 'block';
        document.getElementById('set-target').value = data.target;
    }

    function saveSettings() {
        const nt = parseInt(document.getElementById('set-target').value);
        if (nt > 0) {
            data.target = nt;
            save(); toggleSettings();
            showEffect("TARGET UPDATED!");
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", "ro_wealth_backup.json");
        dl.click();
    }

    function clearData() {
        if(confirm("確定要重置所有紀錄嗎？")) {
            localStorage.removeItem('ro_adventurer_final');
            location.reload();
        }
    }

    function setCat(cat, btn) {
        data.currentCat = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function handle(type) {
        const input = document.getElementById('main-input');
        const amt = parseInt(input.value);
        if (!amt || amt <= 0) return;

        data.hTitle = ""; 
        if (type === 'out') {
            if (data.total < amt) return alert("Zeny 不足！");
            data.total -= amt;
            if (data.total < 500) data.hTitle = "⚠️ [ 破產邊緣 ]";
        } else {
            if (amt >= data.target * 0.1) data.hTitle = "✨ [ 暴發戶 ]";
            data.total += amt;
            showEffect("ZENY UP!");
        }

        const now = new Date();
        const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        data.logs.unshift({ 
            time, amt, type, 
            cat: type === 'in' ? '💰 存錢' : data.currentCat 
        });
        if (data.logs.length > 30) data.logs.pop();
        input.value = '';
        save();
    }

    function showEffect(text) {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); font-size:50px; font-weight:900; color:#ff8c00; text-shadow:2px 2px 20px white; z-index:1000; animation:popUp 1.5s forwards; font-style:italic;`;
        el.innerText = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
    }

    function save() {
        localStorage.setItem('ro_adventurer_final', JSON.stringify(data));
        render();
    }

    function render() {
        const p = Math.min(data.total / data.target, 1);
        document.getElementById('total-val').innerText = data.total.toLocaleString();
        document.getElementById('bar').style.width = (p * 100) + '%';

        let cur = levels[0];
        levels.forEach(l => { if (p >= l.threshold) cur = l; });

        const titleEl = document.getElementById('job-title');
        titleEl.innerText = data.hTitle || cur.title;
        titleEl.style.color = data.hTitle ? "#cc3333" : "#666";
        document.getElementById('job-name').innerText = cur.name;

        let win = 0, wout = 0;
        data.logs.forEach(l => {
            if(l.type === 'in') win += l.amt; else wout += l.amt;
        });
        document.getElementById('week-in').innerText = win.toLocaleString();
        document.getElementById('week-out').innerText = wout.toLocaleString();

        document.getElementById('history').innerHTML = data.logs.map(l => {
            let catColor = "#999";
            if (l.cat.includes("補給")) catColor = "#4caf50";
            if (l.cat.includes("裝備")) catColor = "#607d8b";
            if (l.cat.includes("傳送")) catColor = "#2196f3";
            if (l.cat.includes("雜貨")) catColor = "#795548";
            if (l.cat.includes("存錢")) catColor = "var(--ro-blue)";

            return `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px dashed #eee;">
                    <div style="display:flex; align-items:center;">
                        <span style="background:${catColor}; color:white; padding:3px 10px; border-radius:12px; font-size:11px; margin-right:10px; font-weight:bold;">
                            ${l.cat.includes(' ') ? l.cat.split(' ')[1] : l.cat}
                        </span>
                        <small style="color:#aaa;">${l.time}</small>
                    </div>
                    <span style="color:${l.type==='in'?'#2d8a2d':'#cc3333'}; font-weight:bold; font-size:16px;">
                        ${l.type==='in'?'+':'-'}${l.amt.toLocaleString()}
                    </span>
                </div>
            `;
        }).join('');
    }

    window.onload = () => {
        const s = localStorage.getItem('ro_adventurer_final');
        if (s) data = JSON.parse(s);
        render();
    };
</script>
</body>
</html>
