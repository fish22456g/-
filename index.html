<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 小羊存錢計畫</title>

    <link rel="apple-touch-icon" href="https://i.imgur.com/8N6G5X0.png">
    <link rel="icon" type="image/png" href="https://i.imgur.com/8N6G5X0.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="小羊存錢計畫">

    <style>
        :root {
            --ro-blue: #3d6cb9;
            --ro-red: #cc3333;
            --zeny-gold: #ff8c00;
        }

        body {
            /* 使用經典 RO 藍色漸層背景 */
            background: linear-gradient(180deg, #6a9edb 0%, #ffffff 100%);
            font-family: 'Tahoma', 'Arial', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        .ro-window {
            width: 85%; max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #89a7d3;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px; position: relative;
        }

        /* 稱號與稱職 */
        #job-title { font-size: 14px; color: #555; font-weight: bold; display: block; text-align: center; }
        #job-name { margin: 5px 0 20px 0; font-size: 32px; color: var(--ro-blue); font-weight: 900; text-align: center; }

        /* 進度條 (HP 條樣式) */
        .bar-container { background: #eee; height: 15px; border-radius: 10px; border: 1px solid #ccc; overflow: hidden; margin-bottom: 25px; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4facfe, #00f2fe); transition: 1s ease-in-out; }

        input {
            width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 10px;
            font-size: 22px; font-weight: bold; text-align: center; box-sizing: border-box;
        }

        .cat-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 20px; }
        .cat-btn { padding: 8px 0; font-size: 11px; border: 1px solid #ccc; border-radius: 5px; background: #f9f9f9; cursor: pointer; }
        .cat-btn.active { background: var(--ro-blue); color: white; border-color: var(--ro-blue); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 18px; cursor: pointer; }
        .btn-in { background: var(--ro-blue); }
        .btn-out { background: var(--ro-red); }

        .history { margin-top: 20px; height: 100px; overflow-y: auto; font-size: 12px; border-top: 1px solid #eee; padding-top: 10px; }
        .total-box { text-align: right; margin-top: 20px; font-size: 40px; font-weight: 900; color: var(--zeny-gold); }
    </style>
</head>
<body>

<div class="ro-window">
    <div id="job-title">[ 冒險者 ]</div>
    <div id="job-name">初心者</div>
    
    <div class="bar-container"><div id="bar" class="bar-fill"></div></div>

    <input type="number" id="amt" placeholder="輸入 Zeny" inputmode="numeric">

    <div class="cat-group">
        <button class="cat-btn active" onclick="setCat('💊 補給', this)">補給</button>
        <button class="cat-btn" onclick="setCat('⚔️ 裝備', this)">裝備</button>
        <button class="cat-btn" onclick="setCat('📜 傳送', this)">傳送</button>
        <button class="cat-btn" onclick="setCat('📦 雜貨', this)">雜貨</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-in" onclick="act('in')">存入</button>
        <button class="btn btn-out" onclick="act('out')">支出</button>
    </div>

    <div id="logs" class="history"></div>
    <div class="total-box"><span id="total">0</span> <small style="font-size:15px; color:#999;">Z</small></div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('ro_v3')) || { total: 0, logs: [], target: 10000, cat: '💊 補給' };
    
    function setCat(c, btn) {
        db.cat = c;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function act(type) {
        const val = parseInt(document.getElementById('amt').value);
        if (!val) return;
        if (type === 'out' && db.total < val) return alert("Zeny不足！");
        
        db.total += (type === 'in' ? val : -val);
        db.logs.unshift({ t: new Date().toLocaleTimeString(), a: val, type, c: type==='in'?'💰 存入':db.cat });
        if(db.logs.length > 20) db.logs.pop();
        
        document.getElementById('amt').value = '';
        save();
    }

    function save() {
        localStorage.setItem('ro_v3', JSON.stringify(db));
        render();
    }

    function render() {
        document.getElementById('total').innerText = db.total.toLocaleString();
        const p = Math.min((db.total / db.target) * 100, 100);
        document.getElementById('bar').style.width = p + '%';
        
        const lv = p < 20 ? '初心者' : p < 50 ? '二轉職業' : p < 90 ? '進階二轉' : '發光領主';
        document.getElementById('job-name').innerText = lv;

        document.getElementById('logs').innerHTML = db.logs.map(l => `
            <div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dotted #ccc;">
                <span>${l.c}</span>
                <span style="color:${l.type==='in'?'green':'red'}">${l.type==='in'?'+':'-'}${l.a}</span>
            </div>
        `).join('');
    }

    render();
</script>
</body>
</html>
